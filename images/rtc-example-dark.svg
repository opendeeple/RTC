<svg xmlns="http://www.w3.org/2000/svg" width="990" height="170" viewBox="0 0 990 170" role="img" aria-label="RTC example: the token vectors v1, v2, v3 of one unit of meaning are composed into one meaning vector Q that takes one position and decodes back to the same tokens">
