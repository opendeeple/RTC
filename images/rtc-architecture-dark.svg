<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="RTC architecture: the tokens of each unit of meaning are composed into one meaning vector Q, a causal Transformer runs over meanings, a decoder emits the next unit's tokens and a reconstruction head rebuilds each unit from its own Q">
